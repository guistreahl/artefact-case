# Publishes to Cloud Run every main commit that passed CI.
#
# Authentication through Workload Identity Federation: GitHub proves via OIDC
# that the run came from this repository, on main, and Google returns a
# short-lived credential. No service account key is stored anywhere.

name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, queued. No cancelling: interrupting a deploy midway
# leaves the service in a state nobody chose.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT: ${{ vars.GCP_PROJECT }}
  REGION: us-central1
  # Names of resources already created in Google Cloud. Renaming them would
  # recreate the service and its domain certificate.
  SERVICE: tarefas
  REPOSITORY: servicos
  SECRET: segredo-origem
  DOMAIN: gerenciador.guistreahl.com.br

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # issues the OIDC token exchanged for the Google credential

    steps:
      - uses: actions/checkout@v4
        with:
          # The commit that passed CI, not whatever is on main right now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Identify the version
        run: |
          SHA=$(git rev-parse HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "TAG=sha-${SHA:0:7}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT}/${REPOSITORY}/${SERVICE}:${SHA}" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and publish the image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f infra/docker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Create the revision, with no traffic
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --no-traffic \
            --tag "$TAG" \
            --quiet
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -r --arg tag "$TAG" '.status.traffic[] | select(.tag == $tag) | .url')
          echo "REVISION_URL=$URL" >> "$GITHUB_ENV"
          echo "New revision at $URL"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read the origin secret
        # In production the app rejects requests without the header Cloudflare
        # adds. To test the revision directly on Cloud Run, the pipeline reads
        # the same value from Secret Manager, masked in the log.
        run: |
          VALUE=$(gcloud secrets versions access latest --secret="$SECRET" --project "$PROJECT")
          echo "::add-mask::$VALUE"
          echo "ORIGIN_SECRET=$VALUE" >> "$GITHUB_ENV"

      - name: Test the new revision before releasing it
        env:
          BASE_URL: ${{ env.REVISION_URL }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Release the traffic
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-tags "$TAG=100" --quiet
          # Tags only exist to test each revision before release. Old ones are
          # removed, so the list does not grow with every deploy.
          OLD=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -r --arg tag "$TAG" '[.status.traffic[] | select(.tag and .tag != $tag) | .tag] | join(",")')
          if [ -n "$OLD" ]; then
            gcloud run services update-traffic "$SERVICE" --region "$REGION" --remove-tags "$OLD" --quiet
          fi

      - name: Check the service is up
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          curl -fsS "$URL/api/health"
          # The domain goes through Cloudflare, which challenges anything that
          # is not a browser (403 here is expected). Only no answer at all is a
          # problem, and even then the deploy does not fail: DNS and the
          # certificate live outside the pipeline.
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "https://${DOMAIN}/" || true)
          echo "https://${DOMAIN} answered $CODE"
          if [ "$CODE" = "000" ]; then
            echo "::warning::https://${DOMAIN} did not answer. Check DNS and the certificate."
          fi
