name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes de unidade
        run: npm test

      - name: Build
        run: npm run build

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  imagem:
    # Monta a imagem sem publicar. Um Dockerfile quebrado aparece no PR, e não
    # só depois do merge, na hora do deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tarefas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: A imagem sobe e responde
        run: |
          docker run -d --name tarefas -p 8080:8080 tarefas:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/saude && exit 0
            sleep 1
          done
          docker logs tarefas
          exit 1

  infra:
    # Valida o Terraform sem acessar o Google: formatação, sintaxe e tipos.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
